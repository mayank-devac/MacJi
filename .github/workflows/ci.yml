#
#  ci.yml
#  MacJi
#
#  Created: 2026-11-26
#  Hygiene check, an unsigned Release build (warnings are errors) and the test suite on every
#  push and pull request.
#

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

####################
#### One job, three gates
### check.sh is fast and runs first; the Release build catches warnings, which fail Release only.
# Nothing is signed: CODE_SIGNING_ALLOWED=NO, and the Octopus submodule is not fetched (never compiled).

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Repo hygiene
        run: scripts/check.sh

      - name: Build Release (unsigned)
        run: CONFIGURATION=Release ./build.sh --no-launch --unsigned

      - name: Test
        run: scripts/test.sh --unsigned

      - name: Upload build and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: .build/*.log
          retention-days: 7

#### Swift Testing passes a filter that matches nothing; test.sh fails when zero tests ran.
##################
