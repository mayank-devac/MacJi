#
#  pages.yml
#  MacJi
#
#  Created: 2026-11-26
#  Publishes the WEB/ folder to GitHub Pages (https://mayank-devac.github.io/MacJi/) whenever
#  it changes on main. The site is static: no build step, WEB/ is uploaded as it is.
#

name: Pages

on:
  push:
    branches: [main]
    paths: ["WEB/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: WEB
      - id: deployment
        uses: actions/deploy-pages@v4
